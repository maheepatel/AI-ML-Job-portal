# The scraper for the Render + Neon setup: a full sweep twice a day (every 12 hours) on GitHub's runners,
# writing to Neon. Also publishes the match index the Render web service loads.
# Setup: repo Settings → Secrets and variables → Actions → New secret GRADIENT_DATABASE_URL.
# GitHub may start a scheduled run late (often an hour or more); the Run workflow button starts one now.
name: scrape
on:
  schedule: [{ cron: "30 0,12 * * *" }]   # 00:30 and 12:30 UTC  (06:00 and 18:00 IST)
  workflow_dispatch:                      # "Run workflow" button for a manual sweep
concurrency: { group: scrape, cancel-in-progress: false }
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: backend, shell: bash } }   # bash => pipefail, so a failed sweep fails the job
    env:
      # Accept common alternative names so a slightly different secret name still works.
      GRADIENT_DATABASE_URL: ${{ secrets.GRADIENT_DATABASE_URL || secrets.AI_ML_JOB_PORTAL || secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      # Checkout must come first: every run step works inside backend/, which only exists after it.
      - uses: actions/checkout@v4
      - name: Check the database secret is set
        env:
          # Yes/no per expected name only. Never expose the whole secrets context: GitHub holds
          # runs that do (it looks like secret exfiltration) until someone approves them.
          IN_VARIABLES: ${{ vars.GRADIENT_DATABASE_URL != '' && 'yes' || 'no' }}
        run: |
          if [ -n "$GRADIENT_DATABASE_URL" ]; then
            echo "Database secret found."
            exit 0
          fi
          if [ "$IN_VARIABLES" = "yes" ]; then
            echo "::error::GRADIENT_DATABASE_URL was saved as a VARIABLE, not a secret. Delete it from the Variables tab and add it on the Secrets tab (Settings > Secrets and variables > Actions > Secrets > New repository secret)."
          else
            echo "::error::No repository secret named GRADIENT_DATABASE_URL or AI_ML_JOB_PORTAL, or its value is empty. Add it: Settings > Secrets and variables > Actions > Secrets tab > New repository secret (paste the Neon postgresql:// string, no quotes)."
          fi
          exit 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Sweep
        run: |
          python -m gradient.cli scrape 2>&1 | grep -v "INFO: Fetched"
      # Fresh "we're hiring" posts, newly funded startups and their founders (~1 min). Never fails the run.
      - name: Hiring posts + funded startups
        if: success()
        continue-on-error: true
        run: |
          python -m gradient.cli signals 2>&1 | grep -v "INFO: Fetched"
      # Fill today's apply queue and email it. Needs the owner profile + Gmail app password as
      # secrets; without them this step logs a warning and passes, so the sweep never fails on it.
      - name: Apply queue + email
        if: success()
        env:
          GRADIENT_PROFILE_JSON: ${{ secrets.GRADIENT_PROFILE_JSON }}
          GRADIENT_SMTP_USER: ${{ secrets.GRADIENT_SMTP_USER }}
          GRADIENT_SMTP_PASSWORD: ${{ secrets.GRADIENT_SMTP_PASSWORD }}
          GRADIENT_NOTIFY_TO: ${{ secrets.GRADIENT_NOTIFY_TO }}
        run: python -m gradient.cli notify --event "${{ github.event_name }}"
