name: ci
on: [push, pull_request]
jobs:
  configs:
    # A workflow with a YAML error is silently skipped by GitHub; fail loudly here instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse workflow and deploy configs
        run: |
          python - <<'EOF'
          import glob, sys, tomllib, yaml
          bad = 0
          for f in glob.glob(".github/workflows/*.yml") + ["render.yaml", "docker-compose.yml", "deploy/docker-compose.vps.yml"]:
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as exc:
                  bad += 1
                  print(f"::error file={f}::{exc}")
          tomllib.load(open("fly.toml", "rb"))
          sys.exit(bad)
          EOF
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
